services:
  - type: web
    name: sentinelaix-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/run_dashboard.py --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: SYSTEM_MODE
        value: central_cloud_command
      - key: ANOMALY_THRESHOLD
        value: "0.50"
      - key: CRITICAL_THRESHOLD
        value: "0.85"
