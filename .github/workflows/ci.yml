name: BlockPay Nexus CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    name: Build, Lint & Automated Verification Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Setup Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Pytest Core & Microservice Tests
        run: |
          python -m pytest tests/ -v --junitxml=test-reports/pytest-report.xml

      - name: Run Frontend Production Build
        working-directory: ./frontend
        run: npm run build

      - name: Run Automated Postman API Collection
        run: |
          node scripts/run_postman.js

      - name: Run End-to-End (E2E) Test Suite
        run: |
          node scripts/run_e2e.js

      - name: Build Docker Container Images
        run: |
          docker build -t blockpay-nexus:latest .

      - name: Archive Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-execution-reports
          path: test-reports/
